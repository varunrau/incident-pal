<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#feffff">
  <title>Ampersand · Incident Pal</title>
  <link rel="icon" href="/pal.svg" type="image/svg+xml">
  <meta name="description" content="Watch the errors spike, find the flag, and let your agent roll it back.">
  <meta property="og:title" content="Incident Pal">
  <meta property="og:description" content="Watch the errors spike, find the flag, and let your agent roll it back.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/ampersand.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <img src="/pal.svg" width="26" height="26" alt="">
        <strong>Incident Pal</strong>
      </div>
      <nav class="app-nav" aria-label="Main">
        <a href="/">Dashboard</a>
        <a href="/flags">Feature flags</a>
        <a href="/chat">Chat</a>
        <a href="/ampersand" aria-current="page">Ampersand</a>
      </nav>
    </div>
  </header>
  <main class="transcript-page" aria-labelledby="transcript-heading">
    <div class="section-heading">
      <h1 id="transcript-heading">Ampersand transcript</h1>
      <button class="text-button" id="transcript-refresh" type="button">Refresh</button>
    </div>
    <p class="transcript-session" id="transcript-session"></p>
    <dl class="counts" aria-label="Session usage">
      <div><dt>Input tokens</dt><dd id="transcript-input">—</dd></div>
      <div><dt>Output tokens</dt><dd id="transcript-output">—</dd></div>
      <div><dt>Estimated cost</dt><dd id="transcript-cost">—</dd></div>
    </dl>
    <details class="transcript-instructions" id="transcript-system" hidden>
      <summary>System instructions</summary>
      <pre id="transcript-instructions"></pre>
    </details>
    <section aria-labelledby="transcript-items-heading">
      <div class="section-heading">
        <h2 id="transcript-items-heading">Transcript</h2>
        <button class="text-button" id="transcript-older" type="button" hidden>Load older items</button>
      </div>
      <p id="transcript-status" role="status">Loading transcript…</p>
      <ol id="transcript-items" class="transcript-items"></ol>
    </section>
  </main>
</body>
</html>
